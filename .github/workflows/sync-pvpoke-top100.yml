name: Sync PvPoke top 100

on:
  schedule:
    # Mondays 12:00 UTC
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch rankings
        run: python3 scripts/sync_pvpoke_top100.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top100-gl.md top100-ul.md data/top100-gl.json data/top100-ul.json data/bulk-keep.json index.html
          if git diff --staged --quiet; then
            echo "No ranking changes."
            exit 0
          fi
          git commit -m "chore: sync PvPoke top 100 + bulk keep"
          git push
